# /etc/nginx/sites-available/todoapp
#
# Proxy inverso con TLS para la API. Sustituye api.example.com por el dominio
# real. El certificado se obtiene antes de instalar este archivo:
#   sudo certbot certonly --standalone \
#     --pre-hook "systemctl stop nginx" \
#     --post-hook "systemctl start nginx" \
#     -d api.example.com

upstream todoapp_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 64k;

    # La API no usa corpo grande: 64k cubre de sobra el límite de 2000
    # caracteres de description.
    location /api/ {
        proxy_pass http://todoapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Swagger queda fuera del alcance público. Si necesitas consultarlo en
    # producción, limita el acceso por IP o protégelo con autenticación básica.
    location /docs {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://todoapp_api;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
